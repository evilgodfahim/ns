version: '3.8'

services:
  # FlareSolverr - Bypasses Cloudflare and anti-bot protection
  flaresolverr:
    image: ghcr.io/germondai/trawl:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=UTC
    ports:
      - "8191:8191"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8191/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # New Scientist RSS Scraper
  scraper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: newscientist-rss-scraper
    volumes:
      - ./feed.xml:/app/feed.xml
      - ./.env:/app/.env:ro
    environment:
      - TZ=UTC
      - FLARESOLVERR_ENABLED=true
      - FLARESOLVERR_URL=http://flaresolverr:8191/v1
      - FLARESOLVERR_TIMEOUT=60000
    depends_on:
      - flaresolverr
    restart: unless-stopped
    command: sh -c "sleep 10 && python scraper.py"

  # Optional: Nginx to serve the feed
  nginx:
    image: nginx:alpine
    container_name: newscientist-rss-nginx
    ports:
      - "8080:80"
    volumes:
      - ./feed.xml:/usr/share/nginx/html/feed.xml:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - scraper
    restart: unless-stopped
